[project]
name = "hopfield-fashion-mnist"
version = "0.1.0"
description = "Train a classical Hopfield network on Fashion-MNIST in PyTorch (CS 479 Lecture 13)"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
